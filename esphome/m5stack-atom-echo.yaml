substitutions:
  name: "m5stack-atom-echo"
  friendly_name: M5Stack Atom Echo

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  min_version: 2025.5.0

  on_boot:
    priority: -100
    then:
      - delay: 2s
      - microphone.capture:
          id: echo_microphone

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

logger:
  level: WARN

api:
  encryption:
    key: !secret m5stack_atom_echo__encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO19

microphone:
  - platform: i2s_audio
    id: echo_microphone
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO23
    adc_type: external
    pdm: true
    sample_rate: 16000
    bits_per_sample: 16bit
    correct_dc_offset: true

    on_data:
      - lambda: |-
          // Quick-and-dirty Bitron MV80-ish intercom buzzer detector.
          //
          // 16 kHz, 512 sample window:
          //   window length = 32 ms
          //   bin spacing = 31.25 Hz
          //
          // 50% overlap:
          //   HOP = 256 samples
          //   new analysis every 16 ms
          //
          // Target bins:
          //   13 -> ~406 Hz
          //   22/23 -> ~688 / ~719 Hz
          //   67 -> ~2094 Hz
          //   90 -> ~2812 Hz

          constexpr int N = 512;
          constexpr int HOP = 256;
          constexpr float PI = 3.14159265359f;

          constexpr float RMS_GATE_DB = -34.0f;
          constexpr float SCORE_GATE = 20.0f;
          constexpr int HIT_COUNT_ON = 3;
          constexpr uint32_t HIT_GAP_RESET_MS = 500;

          constexpr uint32_t LOUD_DEBUG_MS = 250;
          constexpr uint32_t METRIC_HOLD_MS = 10000;

          static int16_t buf[N];
          static int pos = 0;
          static int hit_count = 0;
          static uint32_t last_buzzy_ms = 0;
          static uint32_t last_debug = 0;
          static uint32_t last_candidate_ms = 0;
          static bool metrics_are_nan = false;

          auto shift_overlap = [&]() {
            memmove(buf, buf + HOP, (N - HOP) * sizeof(int16_t));
            pos = N - HOP;
          };

          auto publish_nan_metrics = [&]() {
            if (!metrics_are_nan) {
              id(intercom_calc_rms_db).publish_state(NAN);
              id(intercom_buzzer_score).publish_state(NAN);
              id(intercom_ratio_407).publish_state(NAN);
              id(intercom_ratio_703).publish_state(NAN);
              id(intercom_ratio_high).publish_state(NAN);
              metrics_are_nan = true;
            }
          };

          auto read_i16_le = [](uint8_t lo, uint8_t hi) -> int16_t {
            return (int16_t) ((uint16_t) lo | ((uint16_t) hi << 8));
          };

          for (size_t i = 0; i + 1 < x.size(); i += 2) {
            buf[pos++] = read_i16_le(x[i], x[i + 1]);

            if (pos < N) {
              continue;
            }

            float mean = 0.0f;
            for (int j = 0; j < N; j++) {
              mean += buf[j];
            }
            mean /= N;

            float sum_sq = 0.0f;

            for (int j = 0; j < N; j++) {
              float centered = (float) buf[j] - mean;
              sum_sq += centered * centered;
            }

            float rms = sqrtf(sum_sq / N);
            float rms_db = 20.0f * log10f((rms / 32768.0f) + 1e-12f);

            // Below loudness gate: tolerate brief gaps between matching windows.
            if (rms_db < RMS_GATE_DB) {
              uint32_t now = millis();

              if (hit_count > 0 && now - last_buzzy_ms > HIT_GAP_RESET_MS) {
                hit_count = 0;
              }

              bool detected = hit_count >= HIT_COUNT_ON;
              id(intercom_buzzer_detected).publish_state(detected);

              if (!detected && hit_count == 0 && now - last_candidate_ms > METRIC_HOLD_MS) {
                publish_nan_metrics();
              }

              shift_overlap();
              continue;
            }

            auto goertzel_power = [&](int bin) -> float {
              float omega = 2.0f * PI * (float) bin / (float) N;
              float coeff = 2.0f * cosf(omega);

              float q0 = 0.0f;
              float q1 = 0.0f;
              float q2 = 0.0f;

              for (int j = 0; j < N; j++) {
                float s = (float) buf[j] - mean;

                // Hann window.
                float w = 0.5f * (1.0f - cosf(2.0f * PI * (float) j / (float) (N - 1)));
                s *= w;

                q0 = coeff * q1 - q2 + s;
                q2 = q1;
                q1 = q0;
              }

              return q1 * q1 + q2 * q2 - coeff * q1 * q2;
            };

            float p407 = goertzel_power(13);

            float p703a = goertzel_power(22);
            float p703b = goertzel_power(23);
            float p703 = p703a > p703b ? p703a : p703b;

            float p2100 = goertzel_power(67);
            float p2810 = goertzel_power(90);
            float phigh = p2100 > p2810 ? p2100 : p2810;

            float energy = sum_sq + 1.0f;

            float r407 = p407 / energy;
            float r703 = p703 / energy;
            float rhigh = phigh / energy;

            float score = r407 + r703 + (0.25f * rhigh);

            last_candidate_ms = millis();

            bool buzzy =
              r407 > 5.0f &&
              r703 > 5.0f &&
              score > SCORE_GATE;

            uint32_t now = millis();

            if (buzzy) {
              // Treat matching windows as one sequence as long as they are
              // no more than HIT_GAP_RESET_MS apart. Individual non-matches
              // between them are expected with real buzzer audio.
              if (last_buzzy_ms == 0 || now - last_buzzy_ms > HIT_GAP_RESET_MS) {
                hit_count = 0;
              }

              last_buzzy_ms = now;

              if (hit_count < HIT_COUNT_ON) {
                hit_count++;
              }
            } else if (hit_count > 0 && now - last_buzzy_ms > HIT_GAP_RESET_MS) {
              hit_count = 0;
            }

            bool detected = hit_count >= HIT_COUNT_ON;
            id(intercom_buzzer_detected).publish_state(detected);

            if (buzzy || detected || now - last_debug > LOUD_DEBUG_MS) {
              last_debug = now;
              metrics_are_nan = false;

              id(intercom_calc_rms_db).publish_state(rms_db);
              id(intercom_buzzer_score).publish_state(score);
              id(intercom_ratio_407).publish_state(r407);
              id(intercom_ratio_703).publish_state(r703);
              id(intercom_ratio_high).publish_state(rhigh);
            }

            shift_overlap();
          }

speaker:
  - platform: i2s_audio
    id: echo_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO22
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 16000
    channel: stereo
    buffer_duration: 60ms

media_player:
  - platform: speaker
    name: "Speaker"
    id: echo_media_player
    announcement_pipeline:
      speaker: echo_speaker
      format: WAV
      sample_rate: 16000
      num_channels: 2
    buffer_size: 6000
    volume_initial: 50%
    # Home Assistant TTS may arrive as ordinary playback.
    on_play:
      - logger.log: "Audio playback starting - stopping microphone"
      - microphone.stop_capture:
          id: echo_microphone
      - wait_until:
          condition:
            not:
              microphone.is_capturing:
                id: echo_microphone
          timeout: 2s
    # Also handle explicitly marked announcements.
    on_announcement:
      - logger.log: "Announcement starting - stopping microphone"
      - microphone.stop_capture:
          id: echo_microphone
      - wait_until:
          condition:
            not:
              microphone.is_capturing:
                id: echo_microphone
          timeout: 2s
    # Resume buzzer monitoring afterward.
    on_idle:
      - delay: 100ms
      - logger.log: "Audio finished - restarting microphone"
      - microphone.capture:
          id: echo_microphone
    
sensor:
  - platform: sound_level
    microphone: echo_microphone
    measurement_duration: 250ms
    passive: true
    peak:
      id: peak_db
      name: "Peak dB"
      filters:
        - throttle: 2s
    rms:
      id: rms_db
      name: "RMS dB"
      filters:
        - throttle: 2s

  - platform: template
    id: intercom_calc_rms_db
    name: "Intercom Calculated RMS dB"
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    update_interval: never
    force_update: true

  - platform: template
    id: intercom_buzzer_score
    name: "Intercom Buzzer Score"
    accuracy_decimals: 4
    update_interval: never
    force_update: true

  - platform: template
    id: intercom_ratio_407
    name: "Intercom 407 Ratio"
    accuracy_decimals: 4
    update_interval: never
    force_update: true

  - platform: template
    id: intercom_ratio_703
    name: "Intercom 703 Ratio"
    accuracy_decimals: 4
    update_interval: never
    force_update: true

  - platform: template
    id: intercom_ratio_high
    name: "Intercom High Harmonic Ratio"
    accuracy_decimals: 4
    update_interval: never
    force_update: true

binary_sensor:
  - platform: template
    id: intercom_buzzer_detected
    name: "Intercom Buzzer Detected"
    device_class: sound
    filters:
      - delayed_off: 2s

  - platform: gpio
    pin:
      number: GPIO39
      mode: INPUT
      inverted: true
    name: "Button"
    id: atom_button
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    name: "RGB LED"
    id: atom_rgb_led
    restore_mode: RESTORE_DEFAULT_OFF