substitutions:
  capture_token: !secret capture_token
  name: "m5stack-atom-echo"
  friendly_name: M5Stack Atom Echo

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  includes:
    - buzzer_detector.h
    - audio_capture.h

  on_boot:
    priority: -100
    then:
      - lambda: |-
          capture::instance.set_token("${capture_token}");
      - delay: 2s
      - microphone.capture:
          id: echo_microphone

esp32:
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true

logger:
  level: WARN

api:
  encryption:
    key: !secret m5stack_atom_echo__encryption_key

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:

i2s_audio:
  - id: i2s_audio_bus
    i2s_lrclk_pin: GPIO33
    i2s_bclk_pin: GPIO19

microphone:
  - platform: i2s_audio
    id: echo_microphone
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO23
    adc_type: external
    pdm: true
    sample_rate: 16000
    bits_per_sample: 16bit
    correct_dc_offset: true

    on_data:
      - lambda: |-
          // Detection logic lives in buzzer_detector.h (also unit-tested
          // against samples/ by tests/run.sh).
          static buzzer::Detector detector;
          buzzer::Result r;
          uint32_t now = millis();

          capture::instance.feed(x.data(), x.size(), now);

          for (size_t i = 0; i + 1 < x.size(); i += 2) {
            int16_t s = (int16_t) ((uint16_t) x[i] | ((uint16_t) x[i + 1] << 8));
            if (!detector.push(s, now, r))
              continue;

            id(intercom_buzzer_detected).publish_state(r.detected);

            if (r.publish_nan) {
              id(intercom_calc_rms_db).publish_state(NAN);
              id(intercom_buzzer_score).publish_state(NAN);
              id(intercom_ratio_407).publish_state(NAN);
              id(intercom_ratio_703).publish_state(NAN);
              id(intercom_ratio_high).publish_state(NAN);
            }

            if (r.publish_metrics) {
              id(intercom_calc_rms_db).publish_state(r.rms_db);
              id(intercom_buzzer_score).publish_state(r.score);
              id(intercom_ratio_407).publish_state(r.r407);
              id(intercom_ratio_703).publish_state(r.r703);
              id(intercom_ratio_high).publish_state(r.rhigh);
            }
          }

speaker:
  - platform: i2s_audio
    id: echo_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: GPIO22
    dac_type: external
    bits_per_sample: 16bit
    sample_rate: 16000
    channel: stereo
    buffer_duration: 60ms

media_player:
  - platform: speaker
    name: "Speaker"
    id: echo_media_player
    announcement_pipeline:
      speaker: echo_speaker
      format: WAV
      sample_rate: 16000
      num_channels: 2
    buffer_size: 6000
    volume_initial: 50%
    # Home Assistant TTS may arrive as ordinary playback.
    on_play:
      - logger.log: "Audio playback starting - stopping microphone"
      - microphone.stop_capture:
          id: echo_microphone
      - wait_until:
          condition:
            not:
              microphone.is_capturing:
                id: echo_microphone
          timeout: 2s
    # Also handle explicitly marked announcements.
    on_announcement:
      - logger.log: "Announcement starting - stopping microphone"
      - microphone.stop_capture:
          id: echo_microphone
      - wait_until:
          condition:
            not:
              microphone.is_capturing:
                id: echo_microphone
          timeout: 2s
    # Resume buzzer monitoring afterward.
    on_idle:
      - delay: 100ms
      - logger.log: "Audio finished - restarting microphone"
      - microphone.capture:
          id: echo_microphone
    
sensor:
  - platform: sound_level
    microphone: echo_microphone
    measurement_duration: 250ms
    passive: true
    peak:
      id: peak_db
      name: "Peak dB"
      filters:
        - throttle: 2s
    rms:
      id: rms_db
      name: "RMS dB"
      filters:
        - throttle: 2s

  - platform: template
    id: intercom_calc_rms_db
    name: "Intercom Calculated RMS dB"
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    update_interval: never
    force_update: true

  - platform: template
    id: intercom_buzzer_score
    name: "Intercom Buzzer Score"
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    update_interval: never
    force_update: true

  - platform: template
    id: intercom_ratio_407
    name: "Intercom 407 Ratio"
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    update_interval: never
    force_update: true

  - platform: template
    id: intercom_ratio_703
    name: "Intercom 703 Ratio"
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    update_interval: never
    force_update: true

  - platform: template
    id: intercom_ratio_high
    name: "Intercom High Harmonic Ratio"
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    update_interval: never
    force_update: true

binary_sensor:
  - platform: template
    id: intercom_buzzer_detected
    name: "Intercom Buzzer Detected"
    device_class: sound
    filters:
      - delayed_off: 2s

  - platform: gpio
    pin:
      number: GPIO39
      mode: INPUT
      inverted: true
    name: "Button"
    id: atom_button
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms

switch:
  # Audio streaming for offline testing (tools/capture.py). Off after every
  # reboot; the client also needs the capture_token secret.
  - platform: template
    name: "Audio Capture"
    id: audio_capture_enabled
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: diagnostic
    turn_on_action:
      - lambda: capture::instance.set_enabled(true);
    turn_off_action:
      - lambda: capture::instance.set_enabled(false);

interval:
  # Flash the LED blue while a capture client is connected (recording mode),
  # then restore whatever the light was doing before.
  - interval: 400ms
    then:
      - lambda: |-
          static bool was_recording = false;
          static bool blink_on = false;
          static light::LightColorValues saved;
          bool recording = capture::instance.connected();
          auto *led = id(atom_rgb_led);

          if (recording) {
            if (!was_recording) {
              saved = led->remote_values;
              blink_on = false;
            }
            blink_on = !blink_on;
            auto call = led->make_call();
            call.set_transition_length(0);
            call.set_state(blink_on);
            call.set_rgb(0.0f, 0.0f, 1.0f);
            call.set_brightness(1.0f);
            call.perform();
          } else if (was_recording) {
            auto call = led->make_call();
            call.from_light_color_values(saved);
            call.set_transition_length(0);
            call.perform();
          }
          was_recording = recording;

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    name: "RGB LED"
    id: atom_rgb_led
    restore_mode: RESTORE_DEFAULT_OFF